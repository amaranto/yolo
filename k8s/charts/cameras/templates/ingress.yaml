apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: models-ingress
  namespace: {{ .Values.env }}
spec:
 rules:
  - http:
      paths:
      {{- range $k, $v := .Values.modeloConteo }}
      {{- range $c := $v.channels }}
      - path: /stream/{{ $k }}/{{ $c }}/
        pathType: Prefix
        backend:
          service:
            name: {{ include "cameras.fullname" $ }}-conteo-{{$k}}-ch{{$c}}
            port:
              number: 8080
      {{- end }}
      {{- end }}
      {{- range $k, $v := .Values.modeloCarga }}
      {{- range $c := $v.channels }}
      - path: /stream/{{ $k }}/{{ $c }}/
        pathType: Prefix
        backend:
          service:
            name: {{ include "cameras.fullname" $ }}-carga-{{$k}}-ch{{$c}}
            port:
              number: 8080
      {{- end }}
      {{- end }}
    #host: your-store.example