replicaCount: 1
env: poc
gcpProject: raizen-genai-01

images:
  containerImage:
    repository: us-central1-docker.pkg.dev/raizen-genai-01/raizen-sm-artifact/raizen-sm-app
    pullPolicy: IfNotPresent
    tag: v2.3.1

# imagePullSecret:
#   name: dockerhub-credentials
secrets:
  cloudsql: clousql-secret

serviceAccount:
  create: true
  name: computer-vision-app


modeloCarga:
  1506:
    gpu: true
    ingress: true
    iou: "0.5"
    conf: "0.2"    
    delete_video_threshold_in_minutes: 90
    accelarator: nvidia-l4
    pubsub: "vision_app"
    rtsp: "11.37.69.100/cam/realmonitor"
    secrets: rtsp-secret
    subtype: 1
    gcsbucket: "raizen-training-data"
    channels:
